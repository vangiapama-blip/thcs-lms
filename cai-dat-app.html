<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Plickers AI - Ứng Dụng Quét Thẻ Di Động</title>
  
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plickers AI">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: linear-gradient(180deg, #090d16 0%, #0f172a 50%, #020617 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    
    .card {
      max-width: 440px;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      border: 2px solid rgba(16, 185, 129, 0.4);
      border-radius: 36px;
      padding: 30px 24px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6), 0 0 45px rgba(16, 185, 129, 0.2);
      animation: floatUp 0.4s ease;
    }
    @keyframes floatUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .app-icon {
      width: 88px;
      height: 88px;
      background: radial-gradient(circle, #34d399, #059669);
      border-radius: 24px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      border: 3px solid #6ee7b7;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
    }

    h1 { font-size: 1.6rem; font-weight: 900; color: #f8fafc; margin-bottom: 4px; }
    .sub { font-size: 0.88rem; color: #94a3b8; line-height: 1.4; margin-bottom: 18px; font-weight: 600; }
    
    .qr-frame {
      background: #ffffff;
      border-radius: 20px;
      padding: 12px;
      display: inline-block;
      margin-bottom: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      border: 3px solid #10b981;
    }
    .qr-frame img { width: 210px; height: 210px; display: block; border-radius: 10px; }

    .btn-launch {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
      text-decoration: none;
      transition: transform 0.15s;
    }
    .btn-launch:active { transform: scale(0.97); }

    .note-box {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="app-icon">📇</div>
    <h1>PLICKERS AI</h1>
    <p class="sub">Quét thẻ trắc nghiệm & camera không dây Live 60 FPS dành cho giáo viên (iPhone & Android).</p>

    <!-- UNIFIED SINGLE QR CODE -->
    <div class="qr-frame">
      <img id="qr-unified-img" src="" alt="Mã QR Quét Thẻ Plickers">
    </div>

    <!-- DIRECT LAUNCH BUTTON -->
    <a id="btn-direct-app" href="/plickers-mobile.html?v=20260827_205500" class="btn-launch">
      <span>🚀</span> MỞ ỨNG DỤNG QUÉT THẺ NGAY
    </a>

    <div class="note-box">
      Dùng camera điện thoại (iPhone hoặc Android) quét mã QR trên để mở ứng dụng ngay lập tức.
    </div>
  </div>

  <script>
    // Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(()=>{});
      });
    }

    let targetAppUrl = window.location.origin + '/plickers-mobile.html?v=20260827_205500';
    
    // Fetch active Cloudflare or local URL
    async function loadActiveAppUrl() {
      try {
        const res = await fetch('/api/server-ip');
        const data = await res.json();
        if (data && data.appUrl) {
          targetAppUrl = data.appUrl;
        } else if (data && data.plickersUrl) {
          targetAppUrl = data.plickersUrl;
        }
      } catch(e) {}

      const qrImg = document.getElementById('qr-unified-img');
      const btnDirect = document.getElementById('btn-direct-app');
      
      const qrCodeApi = 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&color=0f172a&bgcolor=ffffff&data=' + encodeURIComponent(targetAppUrl);
      
      if (qrImg) qrImg.src = qrCodeApi;
      if (btnDirect) btnDirect.href = targetAppUrl;
    }

    loadActiveAppUrl();
  </script>
</body>
</html>
